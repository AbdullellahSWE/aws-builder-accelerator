[project]
name = "hr-leave-portal"
version = "0.1.0"
description = "HR Leave Portal API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "boto3>=1.43.121",
    "mangum>=0.22.0",
    "aws-lambda-powertools[tracer]>=3.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "uvicorn>=0.54.0",
]
